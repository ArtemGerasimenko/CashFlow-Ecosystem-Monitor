services:
  - type: web
    name: cashflow-ecosystem-monitor
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: cashflow-monitor-history
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: POLL_INTERVAL_MS
        value: 10000
      - key: HISTORY_RETENTION_DAYS
        value: 30
      - key: MAX_HISTORY_ITEMS
        value: 500
      - key: XT_SYMBOL
        value: btc_usdt
      - key: DATA_DIR
        value: /opt/render/project/src/data
